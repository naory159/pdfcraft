name: Build Web Docker Image from Release

on:
  schedule:
    - cron: '0 */6 * * *' # Checks every 6 hours for a new release
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout local repo (for workflow files)
        uses: actions/checkout@v4

      - name: Download latest Web release from upstream
        uses: robinraju/release-downloader@v1.10
        with:
          repository: "storytold/pdfcraft"
          latest: true
          fileName: "pdfcraft-web-*.zip" # Uses a wildcard so it adapts automatically to new versions (e.g. 0.16.2, 0.17.0)
          extract: true                # Automatically unzips the downloaded zip file
          out-file-path: "app-files" # This ensures it creates and extracts into app-files

      - name: Extract version number from downloaded file name
        id: get_version
        run: |
          # Finds the zip file name (e.g. pdfcraft-web-0.16.1.zip) and extracts the version (0.16.1)
          ZIP_FILE=$(ls app-files/*.zip)
          VERSION=$(basename "$ZIP_FILE" | sed -E 's/pdfcraft-web-(.*)\.zip/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Prepare clean web root for Docker
        run: |
          # Create a dedicated clean folder for nginx assets
          mkdir -p docker-html
          # Copy everything from inside the extracted version folder directly into docker-html
          cp -r app-files/pdfcraft-web-*/. docker-html/
          # Optional: verify what we have
          ls -la docker-html

      - name: Remove zip file so only the extracted folder remains
        run: rm -f app-files/*.zip

      - name: List files to verify clean structure
        run: ls -la app-files

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            naory159/pdfcraft:latest
            naory159/pdfcraft:${{ steps.get_version.outputs.VERSION }}
