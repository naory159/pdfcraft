name: Sync Upstream PDFCraft

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04 # Changed from ubuntu-latest
    steps:
      - name: Sync with original repository
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "https://github.com/storytold/pdfcraft.git"
          source_branch: "main"
          destination_branch: "main"
          github_token: ${{ secrets.GITHUB_TOKEN }}
